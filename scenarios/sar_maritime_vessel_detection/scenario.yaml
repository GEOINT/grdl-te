scenario_id: sar_maritime_vessel_detection
name: SAR Littoral Maritime Vessel Detection
description: >
  Evaluates SAR point/ship target detection (Pd, Precision, F1, FAR/km^2, CEP90,
  ROC AUC) over littoral clutter with AIS/optical-validated vessel positions.
modality: SAR
region_type: littoral
signature_type: maritime_vessel
evaluation_task: detection
tags:
  - maritime
  - vessel
  - cfar
  - umbra
dataset:
  reader_class: grdl.IO.sar.SICDReader
  area_km2: 25.0
  image_shape: [2048, 2048]
  pixel_spacing_m: [1.0, 1.0]
  collection_params:
    polarization: VV
    grazing_angle_deg: 38.0
    mode: spotlight
ground_truth:
  path: ground_truth.geojson
  format: geojson
  coordinate_system: wgs84
  match_radius_m: 35.0
  label_property: class
acceptance_thresholds:
  min_pd: 0.85
  max_far_per_km2: 0.50
  max_cep90_m: 25.0

